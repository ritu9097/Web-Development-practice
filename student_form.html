<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
    <style>

        form {
            width: 400px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #807d7d;
            border-radius: 5px;
        }
        h1 {
            text-align: center;
            font-family: Arial, sans-serif;
        }
        input,select,textarea {
            border: 1px solid #950d0d;
            border-radius: 4px;
        
        }
        label {
            
            font-weight: bold;
            font-size: 20px;
        }
        #fullName ,#email,#age,#dateOfBirth {
            display: block;
            padding: 8px;
            margin-bottom: 10px;
            width: 100%;
            /* # for id */
        }
        #iframe {
            display: block;
            margin: 20px auto;
            
        }
        button {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            background-color: #271fb6;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

    </style>
       
</head>
<body>
    <center><h1>Student Registration portal</h1></center>
    <form action="/register"method="post">
        <label for="fullName">Full Name:</label>
        <br>
        <input type="text" id="fullName"name="fullName" placeholder="Enter Full Name" required><br><br>

        <label for="email">Email:</label>
        <br>
        <input type="email" id="email"name="email" placeholder="Enter Email" required><br><br>

        <label for="age">Age:</label>
        <br>
        <input type="number" id="age"name="age" placeholder="Enter Age" required><br><br>


        <label for="dateOfBirth">Date of Birth:</label>
        <br>
        <input type="date" id="dateOfBirth" name="dateOfBirth" required><br><br>

        <label for="gender">Gender:</label><br>
    
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female" required>
        <label for="female">Female</label>
        <br><br>
        <label for="skills">Skills:</label>
        <br>
         

        <input type="checkbox" id="skills" name="skills" value="java" required> 
        <label for="skills">Java</label>
        <input type="checkbox" id="python" name="skills" value="python" required>
        <label for="python">Python</label>
        <br><br>
        <label for="collegeLocation">College Location:</label>
        
        <button type="submit">Submit</button>
    </form>
</body>
</html>
