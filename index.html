<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Form</title>
    <link rel="stylesheet" href="index.css">
    
    
</head>
<body>
    <h1>Student Registration Portal</h1>

    <form action = "/register" method="post">
        <label for="full_name">Full name:</label>
        <input type="text" id="full_name" name="full_name" placeholder="Enter name.." required>
        <br>  <br>

        <label for="number">Phone Number:</label>
        <input type="number" id="number" name="number" placeholder="Enter number..." required>
        <br>  <br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter password..." required>
        <br>  <br>

        <label for="email">University Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter email..." required>
        <br>  <br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" placeholder="Enter age..." required>
        <br>  <br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required>
        <br>  <br>


        <label for="gender">Gender:</label>
        <input type="radio" value="male" name = "gender" id = "male">
        <label for="male">Male</label>
        <input type="radio" value="female" name = "gender" id = "female">
        <label for="female">Female</label>
        <input type="radio" value="other" name = "gender" id = "other">
        <label for="other">Other</label>
        <br>  <br>

        <label for="Courses">Courses:</label>
        <select type="dropdown" name="Course" id="Courses" required>
            <option value="BTECH">B.Tech</option>
            <option value="MBA">MBA</option>
            <option value="BCA">B.C.A</option>
        </select>

        <br> <br>

        <label for="skills">Skills:</label>
        <input type="checkbox" value="python" name = "skills" id = "python">
        <label for="python">Python</label>
        <input type="checkbox" value="java" name = "skills" id = "java"> 
        <label for="java">Java</label>
        <input type="checkbox" value="c++" name = "skills" id = "c++">
        <label for="C++">C++</label>
        <br> <br>

        <label for="Internship">Internship Preference:</label>
        <input type="radio" value="Delhi" name="internship" id="delhi">
        <label for="delhi">Delhi</label>
        <input type="radio" value="Mumbai" name="internship" id="mumbai">
        <label for="mumbai">Mumbai</label>
        <input type="radio" value="Bangalore" name="internship" id="bangalore">
        <label for="bangalore">Bangalore</label>
        <br> <br>

        <label for="Cover">Any Comments:</label>
        <textarea id="Cover" name="Cover" placeholder="Enter any comments..." required></textarea>
        <br> <br>

        <label for="Resume">Upload Resume:</label>
        <input type="file" name="resume" accept=".pdf,.doc,.docx" required>

        <br> <br>
        <button class="Reset" type="Reset">Reset</button>
        <button class="Submit" type="Submit">Submit</button>
        
        

    </form>

</body>
</html>
